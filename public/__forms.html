<!DOCTYPE html>
<html>
  <body>
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <form name="custom-requirement" data-netlify="true" enctype="multipart/form-data" hidden>
      <textarea name="requirement"></textarea>
      <input type="file" name="requirement-image" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
    </form>
  </body>
</html>
